# Build and push the BigQuery sink image.

steps:
  - name: gcr.io/cloud-builders/docker
    id: image
    args:
      - build
      - --file=docker/Dockerfile.sink
      - --tag=${_IMAGE}:${_TAG}
      - --tag=${_IMAGE}:latest
      - .

images:
  - ${_IMAGE}:${_TAG}
  - ${_IMAGE}:latest

substitutions:
  _IMAGE: us-central1-docker.pkg.dev/varun-data-engineering/data-platform/p01-sink
  _TAG: dev

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
