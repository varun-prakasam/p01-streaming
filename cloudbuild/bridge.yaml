# Build and push the bridge image.
#
# Nothing here talks to the cluster. The Deployment pins :latest with imagePullPolicy Always, so
# pushing the image is the deployment and ArgoCD never sees a diff — the manifest describes how to
# run the bridge, not which build of it is current.

steps:
  - name: gcr.io/cloud-builders/docker
    id: image
    args:
      - build
      - --file=docker/Dockerfile.bridge
      - --tag=${_IMAGE}:${_TAG}
      - --tag=${_IMAGE}:latest
      - .

images:
  - ${_IMAGE}:${_TAG}
  - ${_IMAGE}:latest

substitutions:
  _IMAGE: us-central1-docker.pkg.dev/varun-data-engineering/data-platform/p01-bridge
  _TAG: dev

options:
  machineType: E2_HIGHCPU_8
  # Required when no user-owned logs bucket is configured; without it the build fails on a
  # permissions error that reads as though the service account is wrong.
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
