# Build and push the Flink job image.
#
# Slower and larger than the other two — the base image is ~670MB and PyFlink adds a few hundred MB
# more — so it gets a longer timeout and is only rebuilt when sql/ or sqlrunner/ changes.

steps:
  - name: gcr.io/cloud-builders/docker
    id: image
    args:
      - build
      - --file=docker/Dockerfile.flink
      - --tag=${_IMAGE}:${_TAG}
      - --tag=${_IMAGE}:latest
      - .

images:
  - ${_IMAGE}:${_TAG}
  - ${_IMAGE}:latest

substitutions:
  _IMAGE: us-central1-docker.pkg.dev/varun-data-engineering/data-platform/p01-flink
  _TAG: dev

options:
  machineType: E2_HIGHCPU_8
  logging: CLOUD_LOGGING_ONLY

timeout: 2400s
