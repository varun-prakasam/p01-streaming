# Two identities, deliberately.
#
# Terraform provisions exactly one Workload Identity binding for this namespace — `flink`, holding
# bigquery.dataEditor and storage.objectAdmin. Flink needs it to write the warehouse and its
# checkpoints. The bridge does not: it talks to a WebSocket and to Kafka, neither of which is
# Google. Handing the internet-facing ingest process write access to the warehouse would be the
# largest attack surface in the project holding the widest credential in it, for no reason.

apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink
  annotations:
    # Terraform creates the Google service account and the workloadIdentityUser binding naming
    # p01-streaming/flink; it does not create this object. The names must agree or every pod fails
    # to authenticate with an error that reads like a missing role.
    iam.gke.io/gcp-service-account: wl-p01-streaming@varun-data-engineering.iam.gserviceaccount.com

---
# The job's RBAC, owned here rather than by the Flink chart. The chart would create an unannotated
# `flink` ServiceAccount in this namespace, and two ArgoCD Applications fighting over one object
# resolves whichever way the last sync ran. Rules copied verbatim from the chart's own render.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flink
rules:
  - apiGroups: [""]
    resources: ["pods", "configmaps"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/finalizers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flink-role-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flink
subjects:
  - kind: ServiceAccount
    name: flink
    namespace: p01-streaming

---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: bridge
# No annotation, and the token is not mounted. The bridge holds no Google credential at all.
automountServiceAccountToken: false
