# CI/CD for p01-streaming.
#
# The test job runs without any GCP credential — on a fork, on a pull request from anyone, and it
# would have run before this repository had a Workload Identity binding. Anything needing a broker
# or a warehouse runs in the cluster, where an identity already exists.
#
# The build job is gated on main. It authenticates by exchanging the workflow's own OIDC token for a
# short-lived GCP one, so there is no key file and no long-lived repository secret.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Lets the workflow request an OIDC token to exchange for GCP credentials. The build job is the
  # only consumer.
  id-token: write

jobs:
  bridge:
    name: bridge unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r bridge/requirements-dev.txt

      - name: Test with coverage
        # .coveragerc pins branch coverage at 100%. The bridge is the only place data can go missing
        # without anything failing, so the gate is every line and every branch — statement coverage
        # alone called project 3's retry loop covered while its exhaustion path fell through.
        run: |
          coverage run -m unittest discover -s bridge/tests -t . -v
          coverage report

      - name: Coverage summary
        if: always()
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  images:
    name: build images
    runs-on: ubuntu-latest
    needs: [bridge]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v5

      # No key file. The workflow presents its own OIDC token, Google exchanges it for a short-lived
      # credential, and the binding permitting the exchange names this repository — so the token is
      # worthless anywhere else, which a downloadable key never is.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build the bridge image
        run: |
          gcloud builds submit \
            --config=cloudbuild/bridge.yaml \
            --substitutions=_TAG=${{ github.sha }} \
            --project=${{ vars.GCP_PROJECT_ID }} .
