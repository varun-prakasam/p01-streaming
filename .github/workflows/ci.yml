# CI/CD for p01-streaming.
#
# The test job runs without any GCP credential — on a fork, on a pull request from anyone, and it
# would have run before this repository had a Workload Identity binding. Anything needing a broker
# or a warehouse runs in the cluster, where an identity already exists.
#
# The build job is gated on main. It authenticates by exchanging the workflow's own OIDC token for a
# short-lived GCP one, so there is no key file and no long-lived repository secret.

name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # Lets the workflow request an OIDC token to exchange for GCP credentials. The build job is the
  # only consumer.
  id-token: write

jobs:
  python:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          pip install -r bridge/requirements-dev.txt
          pip install -r sink/requirements-dev.txt

      - name: Test with coverage
        # One combined report across both components, so the 100% gate cannot be satisfied by one
        # of them while the other slips. --append is what merges the two runs; without it the
        # second overwrites the first and the gate silently measures half the code.
        #
        # .coveragerc pins *branch* coverage. The bridge and the sink are both places data can go
        # missing without anything failing, and statement coverage alone called project 3's retry
        # loop covered while its exhaustion path fell through returning None.
        run: |
          coverage run -m unittest discover -s bridge/tests -t . -v
          coverage run --append -m unittest discover -s sink/tests -t . -v
          coverage run --append -m unittest discover -s sqlrunner/tests -t . -v
          coverage report

      - name: Validate the Flink SQL
        # Splits and classifies the committed .sql files without a JVM. It catches a mangled file,
        # a statement lost to an unterminated literal, and — the one that matters — an edit that
        # leaves the job with tables and no inserts, which would start cleanly, checkpoint forever
        # and produce nothing.
        run: python -m sqlrunner.main --sql-dir sql --dry-run

      - name: Coverage summary
        if: always()
        run: coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

  images:
    name: build images
    runs-on: ubuntu-latest
    needs: [python]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    steps:
      - uses: actions/checkout@v5

      # No key file. The workflow presents its own OIDC token, Google exchanges it for a short-lived
      # credential, and the binding permitting the exchange names this repository — so the token is
      # worthless anywhere else, which a downloadable key never is.
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.WIF_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Build the bridge image
        run: |
          gcloud builds submit \
            --config=cloudbuild/bridge.yaml \
            --substitutions=_TAG=${{ github.sha }} \
            --project=${{ vars.GCP_PROJECT_ID }} .

      - name: Build the sink image
        run: |
          gcloud builds submit \
            --config=cloudbuild/sink.yaml \
            --substitutions=_TAG=${{ github.sha }} \
            --project=${{ vars.GCP_PROJECT_ID }} .

      - name: Build the Flink image
        # The slow one: a ~670MB base plus PyFlink. Its Dockerfile dry-runs the committed SQL as a
        # build step, so an image that would start a job producing nothing never gets pushed.
        run: |
          gcloud builds submit \
            --config=cloudbuild/flink.yaml \
            --substitutions=_TAG=${{ github.sha }} \
            --project=${{ vars.GCP_PROJECT_ID }} .
